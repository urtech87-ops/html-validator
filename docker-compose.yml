name: markuplens

services:
  vnu:
    image: ${VNU_IMAGE:-ghcr.io/validator/validator@sha256:0811ae47955ff59e52862df4b4d0cba90cd6fdaa62eefc2806aecb883556e616}
    restart: unless-stopped
    # Published on localhost only, so `npm run dev` on the host can reach it.
    ports:
      - "127.0.0.1:8888:8888"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - vnu
    env_file: .env
    environment:
      VNU_URL: http://vnu:8888
      RUNNING_IN_DOCKER: "true"
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    extra_hosts:
      # Lets the app reach sites served on your machine (e.g. XAMPP).
      - "host.docker.internal:host-gateway"
    volumes:
      - markuplens-data:/app/data

volumes:
  markuplens-data:
